[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA: alle stier (f.eks. /bli-med/<token>) skal åpne appen.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Service worker og manifest skal alltid hentes ferske.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
